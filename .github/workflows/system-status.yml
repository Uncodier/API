name: System Status Probes

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Two jobs — not the full Jest suite (legacy failures elsewhere).
# status-tests: unit only in src/lib/status/__tests__
#   (registry, SLA, timelines, sanitization, AI evaluate, publish/webhook).
#   No live HTTP.
# system-probes: live npm run status:probe against STATUS_PROBE_BASE_URL.
#   CI lenient: only database_main + env_core fail the job.
#   Persists via service_role; public reads are webhook + Realtime broadcast.
jobs:
  status-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Scope to status module only — full `npm test` has unrelated legacy failures
      - run: npm run test:status

  system-probes:
    needs: status-tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run system health probes
        run: npm run status:probe
        env:
          CI: 'true'
          STATUS_PROBE_CI_LENIENT: 'true'
          STATUS_PROBE_TRIGGER: github_push
          STATUS_AI_PROBE_ENABLED: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          STATUS_PROBE_BASE_URL: ${{ secrets.STATUS_PROBE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_CHAT_MODEL: ${{ vars.OPENROUTER_CHAT_MODEL }}
          OPENROUTER_IMAGE_MODEL: ${{ vars.OPENROUTER_IMAGE_MODEL }}
          OPENROUTER_VIDEO_MODEL: ${{ vars.OPENROUTER_VIDEO_MODEL }}
          # Direct Azure transcription. Coalesce optional dedicated secrets before injection.
          MICROSOFT_AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_TRANSCRIPTION_ENDPOINT || secrets.MICROSOFT_AZURE_OPENAI_ENDPOINT || secrets.AZURE_OPENAI_ENDPOINT }}
          MICROSOFT_AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_TRANSCRIPTION_API_KEY || secrets.MICROSOFT_AZURE_OPENAI_API_KEY || secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_TRANSCRIPTION_DEPLOYMENT: ${{ vars.AZURE_OPENAI_TRANSCRIPTION_DEPLOYMENT || 'gpt-transcribe' }}
          AZURE_OPENAI_TRANSCRIPTION_API_VERSION: ${{ vars.AZURE_OPENAI_TRANSCRIPTION_API_VERSION || '2024-10-21' }}
          # Direct Azure TTS: dedicated existing credentials, never OpenRouter fallback.
          AZURE_TTS_ENDPOINT: ${{ secrets.AZURE_TTS_ENDPOINT }}
          AZURE_TTS_API_KEY: ${{ secrets.AZURE_TTS_API_KEY }}
          # Unset GitHub vars resolve to ''; keep explicit nonempty TTS defaults.
          AZURE_TTS_DEPLOYMENT: ${{ vars.AZURE_TTS_DEPLOYMENT || 'tts-hd' }}
          AZURE_TTS_API_VERSION: ${{ vars.AZURE_TTS_API_VERSION || '2025-04-01-preview' }}
          AZURE_TTS_VOICE: ${{ vars.AZURE_TTS_VOICE || 'alloy' }}
          APPS_SUPABASE_URL: ${{ secrets.APPS_SUPABASE_URL }}
          APPS_SUPABASE_SERVICE_KEY: ${{ secrets.APPS_SUPABASE_SERVICE_KEY }}
          APPS_SUPABASE_JWT_SECRET: ${{ secrets.APPS_SUPABASE_JWT_SECRET }}
          REPOSITORY_SUPABASE_JWT_SECRET: ${{ secrets.REPOSITORY_SUPABASE_JWT_SECRET }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          REPOSITORY_SUPABASE_ANON_KEY: ${{ secrets.REPOSITORY_SUPABASE_ANON_KEY }}
