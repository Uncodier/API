name: Harness regression tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install local PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client libpq-dev
          pg_config --bindir
      # Providers and sandboxes are faked; DB tests use PGlite or isolated local PostgreSQL.
      # Migrations run only on disposable test DBs, never production; no live probes or credentials.
      - run: npm run test:dependencies
      - run: npm run test:upgrade-regressions
      - run: npm run test:mcp
      - run: npm run test:voice
      - run: npm run test:transactional-email
      - run: npm run test:harness
      - run: npm run test:harness:agent
      - run: npm run test:harness:cloud:unit
      - run: npm run test:harness:cloud